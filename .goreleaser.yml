version: 2
project_name: tack-engine

builds:
  - id: engine
    binary: tack-engine
    main: .
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath, -mod=readonly]
    ldflags:
      - -s -w
      - -X github.com/Dyu-36/tack-engine/internal/version.Version={{.Version}}
      - -X github.com/Dyu-36/tack-engine/internal/version.Commit={{.FullCommit}}
      - -X github.com/Dyu-36/tack-engine/internal/version.BuiltAt={{.CommitDate}}

archives:
  - ids: [engine]
    name_template: "tack-engine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE.md
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - docs/*.md
      - internal/oauth/callback/gotack.png

checksum:
  name_template: SHA256SUMS

snapshot:
  version_template: "0.0.0-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude: ["^chore:", "^ci:"]

release:
  github:
    owner: Dyu-36
    name: tack-engine
  prerelease: auto
  header: |
    Tack Engine is the local agent runtime for [Gotack](https://github.com/Dyu-36/gotack).
