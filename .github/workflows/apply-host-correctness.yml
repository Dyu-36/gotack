name: Apply desktop correctness

on:
  push:
    branches: [production/pi-desktop-completion]
    paths: [.github/workflows/apply-host-correctness.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/gotack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-completion
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply reviewed implementation
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          def replace(path, before, after, count=1):
              p=Path(path); text=p.read_text()
              assert text.count(before)==count,(path,text.count(before),before[:100])
              p.write_text(text.replace(before,after))
          p=Path('internal/zalo/bridge.go'); text=p.read_text()
          parts=re.split(r'(?=\nfunc )',text)
          for index, part in enumerate(parts):
              if 'm.runtime.' in part:
                  start=part.index('{\n')+2
                  part=part[:start]+'\truntime := m.runtimeSnapshot()\n'+part[start:]
                  part=part.replace('m.runtime.', 'runtime.')
                  parts[index]=part
          p.write_text(''.join(parts))
          replace('internal/zalo/bridge.go',
              'if command == "/pair" || strings.HasPrefix(strings.ToLower(text), "/pair") {',
              'if command == "/pair" {')
          replace('internal/zalo/bridge.go', '\tkey := update.MessageID\n',
              '\tkey := ""\n\tif update.MessageID != "" { key = update.ChatID + "\\x00" + update.MessageID }\n')
          replace('internal/zalo/bridge.go',
              '\turl, err := uploadFile(ctx, path)\n\tif err != nil {\n\t\treturn err\n\t}\n',
              '\turl, err := uploadFile(ctx, path)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif !m.paired(chatID) { return fmt.Errorf("Zalo chat was unpaired while uploading") }\n')
          replace('internal/zalo/pairing.go', '\tm.state.PairingCode = pairingCode()\n',
              '\tprevious := m.state.PairingCode\n\tnext := pairingCode()\n\tfor next != "" && next == previous { next = pairingCode() }\n\tm.state.PairingCode = next\n')
          replace('app.go', 'type App struct {\n', 'type App struct {\n\tquitting atomic.Bool\n\tshutdownOnce sync.Once\n')
          p=Path('app.go'); text=p.read_text(); start=text.index('func (a *App) shutdown(')
          text=text[:start]+'''func (a *App) shutdown(ctx context.Context) {
              a.shutdownOnce.Do(func() {
                  if a.link != nil { a.link.CancelScope() }
                  if a.zalo != nil { a.zalo.Stop() }
                  if c := a.getConn(); c != nil && c.fwd != nil { c.fwd.Stop() }
                  if a.sup != nil && a.sup.Owned() {
                      if err := a.sup.Stop(); err != nil && a.log != nil {
                          a.log.Error("stop owned engine on exit", "err", err)
                      }
                  }
                  a.conn.Store(nil)
                  if a.cfg != nil {
                      if err := appconfig.Save(a.cfg); err != nil && a.log != nil {
                          a.log.Error("save desktop settings on exit", "err", err)
                      }
                  }
              })
          }
          '''
          p.write_text(text)
          Path('app_quit.go').write_text('''package main

          import (
              "context"
              "runtime"
              wailsruntime "github.com/wailsapp/wails/v2/pkg/runtime"
          )

          func shouldHideOnClose(platform string, quitting bool) bool {
              return platform == "windows" && !quitting
          }

          func (a *App) beforeClose(ctx context.Context) bool {
              if !shouldHideOnClose(runtime.GOOS, a.quitting.Load()) { return false }
              wailsruntime.WindowHide(ctx)
              return true
          }

          func (a *App) quit() {
              a.quitting.Store(true)
              if a.ctx != nil { wailsruntime.Quit(a.ctx) }
          }
          ''')
          p=Path('main.go'); text=p.read_text()
          start=text.index('\t\t// Closing the window only hides it;')
          end=text.index('\n\t\tStartHidden:',start)
          text=text[:start]+text[end:]
          text=text.replace('Title:     "Tack"','Title:     "Gotack"')
          text=text.replace('OnShutdown:       app.shutdown,','OnShutdown:       app.shutdown,\n\t\tOnBeforeClose:    app.beforeClose,')
          p.write_text(text)
          p=Path('tray_windows.go'); text=p.read_text()
          text=text.replace('systray.SetTooltip("Tack")','systray.SetTooltip("Gotack")')
          text=text.replace('for range show.ClickedCh {\n\t\twailsruntime.WindowShow(a.ctx)\n\t}',
              '''exit := systray.AddMenuItem("Quit Gotack", "Stop Gotack and its local engine")
              go func() {
                  for {
                      select {
                      case <-show.ClickedCh:
                          wailsruntime.WindowShow(a.ctx)
                      case <-exit.ClickedCh:
                          a.quit()
                          systray.Quit()
                          return
                      case <-a.ctx.Done():
                          systray.Quit()
                          return
                      }
                  }
              }()''')
          p.write_text(text)
          Path('app_lifecycle_test.go').write_text('''package main

          import (
              "context"
              "testing"
          )

          type lifecycleEngine struct { stopCalls int; owned bool }
          func (e *lifecycleEngine) Owned() bool { return e.owned }
          func (e *lifecycleEngine) Stop() error { e.stopCalls++; return nil }

          func TestShutdownStopsOnlyOwnedEngineOnce(t *testing.T) {
              for _, owned := range []bool{false, true} {
                  app := NewApp()
                  sup := &lifecycleEngine{owned: owned}
                  app.sup = sup
                  scope := app.link.ReplaceStreamScope(context.Background())
                  app.shutdown(context.Background())
                  app.shutdown(context.Background())
                  if scope.Err() == nil { t.Fatal("event stream was not cancelled") }
                  expected := 0
                  if owned { expected = 1 }
                  if sup.stopCalls != expected { t.Fatalf("owned=%v: stop calls=%d", owned, sup.stopCalls) }
                  if app.getConn() != nil { t.Fatal("closed desktop retains a live connection") }
              }
          }

          func TestWindowCloseAndExplicitQuit(t *testing.T) {
              if !shouldHideOnClose("windows", false) { t.Fatal("normal Windows close should hide to tray") }
              for _, platform := range []string{"windows", "linux", "darwin"} {
                  if shouldHideOnClose(platform, true) { t.Fatal("explicit quit must not hide") }
              }
              if shouldHideOnClose("linux", false) || shouldHideOnClose("darwin", false) { t.Fatal("no-tray platforms must close normally") }
          }
          ''')
          Path('internal/zalo/revocation_test.go').write_text('''package zalo

          import (
              "context"
              "os"
              "path/filepath"
              "sync"
              "testing"
          )

          func TestUnpairCancelsOnlyRevokedChat(t *testing.T) {
              var cancelled []string
              m := NewManager(filepath.Join(t.TempDir(), "zalo.json"), Runtime{Stop: func(_ context.Context, id string) error {
                  cancelled = append(cancelled, id); return nil
              }}, nil)
              m.state.PairedChatIDs = []string{"a", "b"}
              m.state.ChatSessions = map[string]string{"a":"one", "b":"two"}
              m.active = map[string]string{"a":"one", "b":"two"}
              if _, err := m.Unpair("a"); err != nil { t.Fatal(err) }
              if len(cancelled) != 1 || cancelled[0] != "one" { t.Fatalf("cancelled=%v", cancelled) }
              if m.paired("a") || !m.paired("b") || m.active["b"] != "two" { t.Fatal("incorrect revocation scope") }
              reloaded := NewManager(m.path, Runtime{}, nil)
              if reloaded.paired("a") { t.Fatal("revocation was not persisted") }
          }

          func TestStopCancelsRemoteRunsWithoutDuplicateCancellation(t *testing.T) {
              var cancelled []string
              m := NewManager(filepath.Join(t.TempDir(), "zalo.json"), Runtime{Stop: func(_ context.Context, id string) error {
                  cancelled = append(cancelled, id); return nil
              }}, nil)
              m.active = map[string]string{"a":"one", "b":"one", "c":"starting"}
              m.Stop()
              m.Stop()
              if len(cancelled) != 1 || cancelled[0] != "one" { t.Fatalf("cancelled=%v", cancelled) }
              if len(m.active) != 0 { t.Fatal("stopped channel retains active work") }
          }

          func TestCorruptSavedChannelDoesNotPartiallyGrantAccess(t *testing.T) {
              path := filepath.Join(t.TempDir(), "zalo.json")
              if err := os.WriteFile(path, []byte(`{"token":"secret","paired_chat_ids":["intruder"],"update_offset":"invalid"}`), 0o600); err != nil { t.Fatal(err) }
              m := NewManager(path, Runtime{}, nil)
              if m.Status().Configured || m.paired("intruder") { t.Fatal("partially decoded corrupt state was trusted") }
          }

          func TestRuntimeSnapshotIsSafeDuringReplacement(t *testing.T) {
              m := NewManager(filepath.Join(t.TempDir(), "zalo.json"), Runtime{}, nil)
              var wg sync.WaitGroup
              for range 20 {
                  wg.Add(1)
                  go func() {
                      defer wg.Done()
                      m.SetRuntime(Runtime{Workspace: func() string { return "workspace" }})
                      if runtime := m.runtimeSnapshot(); runtime.Workspace != nil { _ = runtime.Workspace() }
                  }()
              }
              wg.Wait()
          }
          ''')
          Path('.github/workflows/apply-host-correctness.yml').unlink()
          changed=subprocess.check_output(['git','ls-files','-m','-o','--exclude-standard']).decode().splitlines()
          files=[p for p in changed if p.endswith('.go') and Path(p).is_file()]
          subprocess.run(['gofmt','-w',*files],check=True)
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add app.go app_quit.go app_lifecycle_test.go main.go tray_windows.go internal/zalo .github/workflows/apply-host-correctness.yml
          git commit -m 'fix: real desktop quit, owned-engine shutdown and Zalo revocation'
          git fetch origin production/pi-desktop-completion
          git rebase origin/production/pi-desktop-completion
          git push origin HEAD:production/pi-desktop-completion
      - name: Verify desktop Go code
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 ./internal/zalo ./internal/engine ./internal/workspaceconfig
