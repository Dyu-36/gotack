name: Agent 2 clean-main finalizer

on:
  push:
    branches: [agent2-clean-main]
  workflow_dispatch:

concurrency:
  group: agent2-clean-main-finalizer
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      head_sha: ${{ steps.publish.outputs.head_sha }}
      head_tree: ${{ steps.publish.outputs.head_tree }}
      has_diff: ${{ steps.publish.outputs.has_diff }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply idempotent hardening
        run: python3 .github/agent2_clean.py

      - name: Format, lint patch shape, and enforce scope
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/goimports@latest
          mapfile -t gofiles < <(find . \
            -path './.git' -prune -o \
            -path './frontend' -prune -o \
            -path './build' -prune -o \
            -path './third_party' -prune -o \
            -name '*.go' -print)
          goimports -w "${gofiles[@]}"
          test -z "$(gofmt -l "${gofiles[@]}")"
          git diff --check
          node scripts/check-repository-invariants.mjs
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f) }'
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-paths
          if grep -E '^(frontend/|build/|scripts/|third_party/crush/)' /tmp/changed-paths; then
            echo 'out-of-scope path changed' >&2
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import re
          bad = []
          files = list(Path('.').glob('*.go')) + list(Path('internal').rglob('*.go')) + list(Path('cmd').rglob('*.go'))
          for path in files:
              if path.name.endswith('_test.go'):
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'["`]github\.com/Dyu-36/gotack/third_party/crush/internal/', text):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Crush internal imports: ' + ', '.join(sorted(bad)))
          PY

      - name: Verify backend, vet, static analysis, and dead code
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          go install golang.org/x/tools/cmd/deadcode@latest
          test -z "$(deadcode -test ./...)"

      - name: Generate Wails bindings
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${version}"
          if ! wails generate module; then
            wails generate bindings
          fi

      - name: Verify frontend without committing it
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run check
            pnpm run build
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
            yarn run check
            yarn run build
          elif [[ -f package-lock.json ]]; then
            npm ci
            npm run check
            npm run build
          else
            npm install
            npm run check
            npm run build
          fi
          cd ..
          git restore --source=HEAD --staged --worktree frontend
          git clean -fd frontend/wailsjs >/dev/null 2>&1 || true

      - name: Publish the exact validated tree without temporary files
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/agent2*.py
          rm -f .github/workflows/agent2*.yml
          rm -f .github/workflows/agent-source-export.yml .github/workflows/agent-backend-audit.yml
          git add -A
          if git diff --cached --name-only | grep -E '^(frontend/|build/|scripts/|third_party/crush/)'; then
            echo 'out-of-scope path staged' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: harden backend boundaries and contracts'
          fi
          git push origin HEAD:agent2-clean-main
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          git fetch origin main
          if git diff --quiet origin/main "$head_sha"; then
            has_diff=false
          else
            has_diff=true
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_tree=$head_tree" >> "$GITHUB_OUTPUT"
          echo "has_diff=$has_diff" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: prepare
    if: needs.prepare.outputs.has_diff == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build Wails production binary
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
          wails build -clean

  merge-and-verify:
    needs: [prepare, windows-build]
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.has_diff == 'false' || needs.windows-build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      HEAD_TREE: ${{ needs.prepare.outputs.head_tree }}
      HAS_DIFF: ${{ needs.prepare.outputs.has_diff }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Merge only the exact validated head
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_DIFF" == "true" ]]; then
            pr_number="$(gh pr list --state open --head agent2-clean-main --base main --json number --jq '.[0].number // empty')"
            if [[ -z "$pr_number" ]]; then
              pr_url="$(gh pr create \
                --base main \
                --head agent2-clean-main \
                --title 'refactor: harden backend boundaries and contracts' \
                --body 'Thermo-nuclear backend hardening validated by Go tests, vet, staticcheck, deadcode, repository invariants, frontend check/build, and a Windows Wails production build.')"
              pr_number="${pr_url##*/}"
            fi
            gh pr merge "$pr_number" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          else
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/agent2-clean-main" >/dev/null 2>&1 || true
          fi
          for branch in agent2-final-audit agent2-thermo-hardening agent2-source-export-20260902; do
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done

      - name: Prove main has the exact validated tree and no Agent 2 residue
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            git fetch origin main
            main_tree="$(git rev-parse origin/main^{tree})"
            if [[ "$main_tree" == "$HEAD_TREE" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "main tree $main_tree does not match validated tree $HEAD_TREE" >&2
              exit 1
            fi
            sleep 5
          done
          git checkout --force origin/main
          test ! -e .github/agent2_clean.py
          test ! -e .github/agent2_hardening.py
          test ! -e .github/workflows/agent2-clean-main.yml
          test ! -e .github/workflows/agent2-final-audit.yml
          test ! -e .github/workflows/agent2-final-audit-v2.yml
          test ! -e .github/workflows/agent2-finalize-hardening.yml
          test ! -e .github/workflows/agent2-merge-validated.yml
          test ! -e .github/workflows/agent-source-export.yml
          test ! -e .github/workflows/agent-backend-audit.yml
          go test ./...
          go vet ./...
          node scripts/check-repository-invariants.mjs
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          go install golang.org/x/tools/cmd/deadcode@latest
          test -z "$(deadcode -test ./...)"
          test -z "$(git status --short)"
