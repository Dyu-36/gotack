name: Product integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-product:
    name: Complete Windows distribution
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up product build tools
        uses: ./.github/actions/setup-desktop
        with:
          python: 'true'
          go-cache-dependency-path: |
            go.sum
      - name: Build verified complete product
        shell: pwsh
        run: ./scripts/build-product.ps1
      - name: Detect host concurrency defects
        shell: pwsh
        run: |
          go test -race -mod=readonly -count=1 ./internal/desktop ./internal/zalo ./internal/engine ./internal/workspaceconfig
          if ($LASTEXITCODE -ne 0) { throw 'Race-detector tests failed' }
      - name: Require real IPC contract tests
        shell: pwsh
        env:
          GOTACK_REQUIRE_ENGINE: '1'
        run: |
          $env:GOTACK_TEST_ENGINE = "$env:GITHUB_WORKSPACE/build/bin/gotack.exe"
          go test -mod=readonly -count=1 -run '^TestBridge' -v .
          if ($LASTEXITCODE -ne 0) { throw 'Bridge contract tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: gotack-windows-amd64
          path: |
            artifacts/gotack-windows-amd64.zip
            artifacts/SHA256SUMS
            artifacts/product-manifest.json
          if-no-files-found: error
          retention-days: 14
