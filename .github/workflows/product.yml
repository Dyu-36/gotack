name: Product integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Exact product sources
    runs-on: ubuntu-latest
    outputs:
      engine_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve engine pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '\r\n' < .tack-pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid .tack-pin'; exit 1; }
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Dyu-36/tack-engine
          ref: ${{ steps.pin.outputs.sha }}
          path: .engine-source
          persist-credentials: false
      - name: Archive source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-sources
          git archive --format=tar.gz HEAD > product-sources/gotack.tar.gz
          git -C .engine-source archive --format=tar.gz HEAD > product-sources/tack-engine.tar.gz
          printf 'host=%s\nengine=%s\n' "$(git rev-parse HEAD)" "$(git -C .engine-source rev-parse HEAD)" > product-sources/revisions.txt
          (cd product-sources && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: product-sources
          path: product-sources/
          if-no-files-found: error
          retention-days: 14

  linux-contract:
    name: Linux engine and IPC contract
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Dyu-36/tack-engine
          ref: ${{ needs.sources.outputs.engine_sha }}
          path: .engine-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .engine-source/go.sum
      - name: Verify and build pinned engine
        shell: pwsh
        run: ./scripts/build-engine.ps1 -EngineSource .engine-source -Output "$env:GITHUB_WORKSPACE/build/bin/resources/tack-engine"
      - name: Verify desktop
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 ./internal/zalo ./internal/engine ./internal/workspaceconfig
      - name: Require real IPC contract tests
        shell: bash
        env:
          GOTACK_REQUIRE_ENGINE: '1'
        run: |
          set -euo pipefail
          export GOTACK_TEST_ENGINE="$GITHUB_WORKSPACE/build/bin/resources/tack-engine"
          go test -mod=readonly -count=1 -run '^TestBridge' -v .

  windows-product:
    name: Complete Windows distribution
    needs: sources
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Dyu-36/tack-engine
          ref: ${{ needs.sources.outputs.engine_sha }}
          path: .engine-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .engine-source/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/timetable-requirements.lock
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Wails' }
      - name: Build verified complete product
        shell: pwsh
        run: ./scripts/build-product.ps1 -EngineSource .engine-source
      - name: Detect host concurrency defects
        shell: pwsh
        run: |
          go test -race -mod=readonly -count=1 ./internal/zalo ./internal/engine ./internal/workspaceconfig
          if ($LASTEXITCODE -ne 0) { throw 'Race-detector tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: gotack-windows-amd64
          path: |
            artifacts/gotack-windows-amd64.zip
            artifacts/SHA256SUMS
            artifacts/product-manifest.json
          if-no-files-found: error
          retention-days: 14
