name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WAILS_VERSION: v2.15.0
  PNPM_VERSION: 11.20.0

jobs:
  go:
    name: Go test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      # CI ran only test and vet, so two real kinds of drift could merge without
      # anything failing: a gofmt regression, and a stale events.generated.ts
      # after internal/uievents/names.go changes. Both are gates now.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check generated event names are in sync
        run: |
          go run ./internal/uievents/gen/main.go
          git diff --exit-code -- frontend/src/platform/events.generated.ts

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check repository invariants
        run: node scripts/check-repository-invariants.mjs
      - name: Check frontend
        run: pnpm --dir frontend check
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build

  windows:
    name: Windows Wails portable build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build Gotack
        shell: pwsh
        run: wails build -platform windows/amd64 -clean
      - name: Load Crush pin
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ("CRUSH_COMMIT=" + (Get-Content .crush-pin -Raw).Trim())
      - name: Build pinned Crush
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/charmbracelet/crush.git "$env:RUNNER_TEMP\crush"
          git -C "$env:RUNNER_TEMP\crush" checkout $env:CRUSH_COMMIT
          New-Item -ItemType Directory -Force build\bin\resources | Out-Null
          Push-Location "$env:RUNNER_TEMP\crush"
          go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\crush.exe" .
          Pop-Location
      - name: Build office MCP server
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\office.exe" ./cmd/office
      - name: Assemble portable directory
        shell: pwsh
        run: |
          $out = 'artifacts\gotack-windows-amd64'
          New-Item -ItemType Directory -Force "$out\resources" | Out-Null
          Copy-Item build\bin\gotack.exe "$out\gotack.exe"
          Copy-Item build\bin\resources\crush.exe "$out\resources\crush.exe"
          Copy-Item build\bin\resources\office.exe "$out\resources\office.exe"
          Copy-Item build\windows\README.md "$out\README.txt"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotack-windows-amd64
          path: artifacts/gotack-windows-amd64
          if-no-files-found: error
