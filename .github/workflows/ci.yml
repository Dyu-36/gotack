name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WAILS_VERSION: v2.15.0
  PNPM_VERSION: 11.20.0
  STATICCHECK_VERSION: v0.8.1
  DEADCODE_VERSION: v0.49.0

jobs:
  go:
    name: Go test and analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          staticcheck ./...
      - name: Check unreachable functions
        run: |
          go install golang.org/x/tools/cmd/deadcode@${{ env.DEADCODE_VERSION }}
          deadcode -test ./... | tee deadcode.txt
          test ! -s deadcode.txt
      - name: Upload deadcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadcode-diagnostics
          path: deadcode.txt
          if-no-files-found: warn
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check generated event names are in sync
        run: |
          go run ./internal/uievents/gen/main.go
          git diff --exit-code -- frontend/src/platform/events.generated.ts

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          wails generate module
      - name: Check repository invariants
        run: node scripts/check-repository-invariants.mjs
      - name: Check frontend
        run: pnpm --dir frontend check
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build
