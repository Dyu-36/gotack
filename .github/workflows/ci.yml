name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  WAILS_VERSION: v2.15.0
  PNPM_VERSION: 11.20.0
  STATICCHECK_VERSION: v0.8.1
  DEADCODE_VERSION: v0.49.0

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test and analysis
    # Gotack ships windows-amd64 only, so its host gates run on that platform.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          staticcheck ./...
      - name: Check unreachable functions
        run: |
          go install golang.org/x/tools/cmd/deadcode@"$DEADCODE_VERSION"
          deadcode -test ./... | tee deadcode.txt
          test ! -s deadcode.txt
      - name: Upload deadcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadcode-diagnostics
          path: deadcode.txt
          if-no-files-found: warn
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted || true
            exit 1
          fi
      - name: Check generated event names are in sync
        run: |
          go run ./internal/uievents/gen/main.go
          git diff --exit-code -- frontend/src/platform/events.generated.ts

  frontend:
    name: Frontend check and build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Generate Wails bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION
          wails generate module
      - name: Check frontend
        run: pnpm --dir frontend check
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build
