name: Development bundle

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/development-bundle.yml]

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    if: github.head_ref == 'production/pi-desktop-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: development-dependencies
          path: dependencies
          repository: Dyu-36/gotack
          run-id: 35517385740
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - name: Split dependency archive
        shell: bash
        run: |
          set -euo pipefail
          split -b 400M dependencies/go-modules.tar.gz dependencies/go-modules.part-
          pnpmRoot="$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")"
          tar -czf dependencies/pnpm.tar.gz -C "$pnpmRoot" .
          (cd dependencies && sha256sum go-modules.part-* frontend-dependencies.tar.gz pnpm.tar.gz > split-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules-part-aa
          path: dependencies/go-modules.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules-part-ab
          path: dependencies/go-modules.part-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: go-modules-part-ac
          path: dependencies/go-modules.part-ac
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-offline
          path: |
            dependencies/frontend-dependencies.tar.gz
            dependencies/pnpm.tar.gz
            dependencies/split-SHA256SUMS
          compression-level: 0
          retention-days: 1
