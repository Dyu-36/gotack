name: Validate Hermes parity patch

on:
  push:
    branches:
      - agent/hermes-learning-loop-parity

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/hermes-learning-loop-parity
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply patch
        run: |
          python3 scripts/hermes_parity_patch.py
          python3 scripts/hermes_parity_followup.py
      - name: Format changed Go files
        run: gofmt -w bind_session.go internal/reflection/prompt.go internal/reflection/reflection_test.go internal/skillmanage/filesystem.go internal/skillmanage/manager_test.go
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Prepare Wails binding generation
        run: |
          mkdir -p frontend/dist
          printf '%s\n' '<!doctype html><html><body></body></html>' > frontend/dist/index.html
      - name: Generate Wails bindings
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 generate module
      - name: Build frontend assets
        run: pnpm --dir frontend build
      - name: Test learning-loop internals
        run: go test ./internal/memory ./internal/skillmanage ./internal/recall ./internal/reflection ./internal/guard
      - name: Test learning-loop helper binaries
        run: go test ./cmd/memory ./cmd/skills ./cmd/recall ./cmd/guard
      - name: Test all Go packages
        run: go test ./...
      - name: Vet all Go packages
        run: go vet ./...
      - name: Check repository invariants
        run: node scripts/check-repository-invariants.mjs
      - name: Check frontend
        run: pnpm --dir frontend check
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Verify architectural boundaries and skill roots
        shell: bash
        run: |
          if grep -R -n --include='*.go' 'third_party/crush/internal' --exclude-dir=.git .; then
            echo 'forbidden Crush internal import found'
            exit 1
          fi
          grep -R -n --include='*.go' -E 'func userSkillsDir|userSkillsDir|global.*skill|skill.*path' --exclude-dir=third_party . || true
      - name: Commit validated patch
        shell: bash
        run: |
          rm -rf frontend/dist frontend/wailsjs
          rm scripts/hermes_parity_patch.py scripts/hermes_parity_followup.py .github/workflows/agent-run-fixed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bind_session.go
          git add internal/reflection/prompt.go internal/reflection/reflection_test.go
          git add internal/skillmanage/filesystem.go internal/skillmanage/manager_test.go
          git add .github/workflows/ci.yml
          git add -u scripts/hermes_parity_patch.py scripts/hermes_parity_followup.py .github/workflows/agent-run-fixed.yml
          git diff --cached --check
          git commit -m 'fix(hermes): complete detached learning-loop parity'
          git push origin HEAD:agent/hermes-learning-loop-parity
