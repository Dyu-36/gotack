name: Agent Hermes race audit

on:
  push:
    branches: [agent2-hermes-race-audit]

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        run: go test -race -count=1 ./...
