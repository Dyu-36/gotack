name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.15.0
  PNPM_VERSION: 11.20.0

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag matches product version
        shell: pwsh
        run: |
          $productVersion = (Get-Content wails.json -Raw | ConvertFrom-Json).Info.productVersion
          $expected = "v$productVersion"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match wails.json productVersion $productVersion"
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Generate Wails bindings
        run: wails generate module

      - name: Load Crush pin
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ("CRUSH_COMMIT=" + (Get-Content .crush-pin -Raw).Trim())

      - name: Verify source
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          $unformatted = @(gofmt -l (git ls-files '*.go'))
          if ($unformatted.Count -gt 0) {
            throw "Go files need gofmt: $($unformatted -join ', ')"
          }
          go run ./internal/uievents/gen/main.go
          git diff --exit-code -- frontend/src/platform/events.generated.ts
          node scripts/check-repository-invariants.mjs
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build

      - name: Build Gotack
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -webview2 download

      - name: Build pinned Crush
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/charmbracelet/crush.git "$env:RUNNER_TEMP\crush"
          git -C "$env:RUNNER_TEMP\crush" checkout $env:CRUSH_COMMIT
          ./scripts/apply-crush-patches.ps1 -CrushDir "$env:RUNNER_TEMP\crush"
          New-Item -ItemType Directory -Force build\bin\resources | Out-Null
          Push-Location "$env:RUNNER_TEMP\crush"
          go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\crush.exe" .
          Pop-Location

      - name: Build office MCP server
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\office.exe" ./cmd/office

      - name: Build guard approval hook
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\guard.exe" ./cmd/guard

      - name: Build memory MCP server
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\memory.exe" ./cmd/memory

      - name: Build skills MCP server
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\skills.exe" ./cmd/skills

      - name: Build recall MCP server
        shell: pwsh
        run: go build -trimpath -o "$env:GITHUB_WORKSPACE\build\bin\resources\recall.exe" ./cmd/recall

      - name: Bundle officecli binary and skills
        shell: pwsh
        run: |
          $resourcesDir = "$env:GITHUB_WORKSPACE\build\windows\resources"
          New-Item -ItemType Directory -Force $resourcesDir | Out-Null
          $localOffice = "$env:LOCALAPPDATA\OfficeCLI\officecli.exe"
          if (Test-Path $localOffice) {
            Copy-Item $localOffice "$resourcesDir\officecli.exe" -Force
          } else {
            Write-Host "Downloading officecli (Windows x64)..."
            Invoke-WebRequest -Uri "https://github.com/iOfficeAI/OfficeCLI/releases/latest/download/officecli-windows-amd64.exe" -OutFile "$resourcesDir\officecli.exe"
          }
          & "$resourcesDir\officecli.exe" --version
          if (Test-Path "$env:GITHUB_WORKSPACE\resources\skills") {
            Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\resources\skills" "$resourcesDir\skills"
          } else {
            Write-Host "No vendored skills to bundle."
          }
      - name: Prepare bundled runtime payloads
        shell: pwsh
        run: |
          # resources/bin is git-ignored by design; the prepare script
          # downloads the Python 3.12 runtime, uv, officecli and the
          # timetable libraries so the ZIP ships a self-contained stack.
          ./scripts/prepare-resources.ps1
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $name = "gotack-$env:GITHUB_REF_NAME-windows-amd64"
          $out = "artifacts\$name"
          New-Item -ItemType Directory -Force "$out\resources" | Out-Null
          Copy-Item build\bin\gotack.exe "$out\gotack.exe"
          Copy-Item build\bin\resources\crush.exe "$out\resources\crush.exe"
          Copy-Item build\bin\resources\office.exe "$out\resources\office.exe"
          Copy-Item build\bin\resources\guard.exe "$out\resources\guard.exe"
          Copy-Item build\bin\resources\memory.exe "$out\resources\memory.exe"
          Copy-Item build\bin\resources\skills.exe "$out\resources\skills.exe"
          Copy-Item build\bin\resources\recall.exe "$out\resources\recall.exe"
          if (Test-Path build\windows\resources\officecli.exe) {
            Copy-Item build\windows\resources\officecli.exe "$out\resources\officecli.exe"
          }
          if (Test-Path build\windows\resources\skills) {
            Copy-Item -Recurse build\windows\resources\skills "$out\resources\skills"
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\resources\bin") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\resources\bin" -Force |
              Where-Object { $_.Name -ne '.gitkeep' } |
              Copy-Item -Destination "$out\resources" -Recurse -Force
          } else {
            Write-Host "No prepared runtime payloads to bundle."
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\resources\context") {
            Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\resources\context" "$out\resources\context"
          } else {
            Write-Host "No tracked context to bundle."
          }
          Copy-Item build\windows\README.md "$out\README.txt"
          Compress-Archive -Path "$out\*" -DestinationPath "artifacts\$name.zip"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "artifacts\gotack-$env:GITHUB_REF_NAME-windows-amd64.zip" --verify-tag --generate-notes --title "Gotack $env:GITHUB_REF_NAME"
