name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.15.0
  PNPM_VERSION: 11.20.0
  ENGINE_REPOSITORY_URL: ${{ vars.ENGINE_REPOSITORY_URL }}

jobs:
  windows-portable:
    name: Windows portable release (manual)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Generate Wails bindings
        run: wails generate module

      - name: Load engine pin
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV ("ENGINE_COMMIT=" + (Get-Content .tack-pin -Raw).Trim())

      - name: Verify source
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          $unformatted = @(gofmt -l (git ls-files '*.go'))
          if ($unformatted.Count -gt 0) {
            throw "Go files need gofmt: $($unformatted -join ', ')"
          }
          go run ./internal/uievents/gen/main.go
          git diff --exit-code -- frontend/src/platform/events.generated.ts
          pnpm --dir frontend check
          pnpm --dir frontend test
          pnpm --dir frontend build

      - name: Build Tack
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -webview2 download

      - name: Build pinned engine
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENGINE_REPOSITORY_URL)) {
            throw "Repository variable ENGINE_REPOSITORY_URL is required"
          }
          $engineSource = Join-Path $env:RUNNER_TEMP "tack-engine-source"
          git clone --filter=blob:none $env:ENGINE_REPOSITORY_URL $engineSource
          git -C $engineSource checkout $env:ENGINE_COMMIT
          New-Item -ItemType Directory -Force build\bin\resources | Out-Null
          ./scripts/build-engine.ps1 -EngineSource $engineSource -Output "$env:GITHUB_WORKSPACE\build\bin\resources\tack-engine.exe"


      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $name = "tack-windows-amd64"
          $out = "artifacts\$name"
          New-Item -ItemType Directory -Force "$out\resources" | Out-Null
          Copy-Item build\bin\tack.exe "$out\tack.exe"
          Copy-Item build\bin\resources\tack-engine.exe "$out\resources\tack-engine.exe"
          Copy-Item build\bin\resources\tack-engine.exe.build.json "$out\resources\tack-engine.exe.build.json"

          if (Test-Path build\windows\README.md) {
            Copy-Item build\windows\README.md "$out\README.txt"
          }
          Compress-Archive -Path "$out\*" -DestinationPath "artifacts\$name.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tack-windows-amd64
          path: artifacts/tack-windows-amd64.zip
          if-no-files-found: error
