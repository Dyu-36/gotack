name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Verified Windows portable artifact
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read exact engine revision
        id: pin
        shell: pwsh
        run: |
          $pin = (Get-Content .tack-pin -Raw).Trim()
          if ($pin -notmatch '^[0-9a-f]{40}$') { throw 'Invalid engine pin' }
          "sha=$pin" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v5
        with:
          repository: Dyu-36/tack-engine
          ref: ${{ steps.pin.outputs.sha }}
          path: .engine-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .engine-source/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
          cache: pip
          cache-dependency-path: scripts/timetable-requirements.lock
      - name: Install pinned Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed' }
      - name: Build the same verified product as CI
        shell: pwsh
        run: ./scripts/build-product.ps1 -EngineSource .engine-source
      - name: Inspect complete portable contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive artifacts/gotack-windows-amd64.zip -DestinationPath package-inspection
          foreach ($path in @('gotack.exe', 'resources/tack-engine.exe', 'resources/python/python.exe', 'resources/python/runtime-manifest.json', 'licenses/tack-engine-LICENSE', 'product-manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path package-inspection $path) -PathType Leaf)) { throw "Missing product component: $path" }
          }
      - name: Upload exact portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotack-windows-amd64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Inventory and attest the built product
    needs: windows-portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gotack-windows-amd64
          path: artifacts
      - name: Verify archive checksum and unpack
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c SHA256SUMS)
          mkdir package
          unzip -q artifacts/gotack-windows-amd64.zip -d package
      - name: Inventory the distributed binaries and Python packages
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: package
          syft-version: v1.52.0
          format: spdx-json
          output-file: artifacts/gotack-windows-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/gotack-windows-amd64.zip
      - name: Attest product inventory
        id: inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/gotack-windows-amd64.zip
          sbom-path: artifacts/gotack-windows-amd64.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: gotack-provenance-and-sbom
          path: |
            artifacts/gotack-windows-amd64.spdx.json
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.inventory.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
