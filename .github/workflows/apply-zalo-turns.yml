name: Apply correlated Zalo turns

on:
  push:
    branches: [production/pi-desktop-completion]
    paths: [.github/workflows/apply-zalo-turns.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/gotack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-completion
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          def replace(path, before, after, count=1):
              p=Path(path); text=p.read_text()
              assert text.count(before)==count,(path,text.count(before),before[:100])
              p.write_text(text.replace(before,after))
          def replace_function(path, signature, replacement):
              p=Path(path); text=p.read_text(); start=text.index(signature)
              end=text.find('\nfunc ',start+len(signature))
              if end < 0: end=len(text)
              p.write_text(text[:start]+replacement.rstrip()+'\n'+text[end:])
          p=Path('app_quit.go'); text=p.read_text(); start=text.index('func (a *App) quit()')
          quitting=text[start:]
          p.write_text(text[:start])
          p=Path('tray_windows.go'); p.write_text(p.read_text()+'\n'+quitting)
          p=Path('internal/zalo/manager.go'); text=p.read_text()
          start=text.index('type Runtime struct {'); end=text.index('\n}\n',start)+3
          text=text[:start]+'''type Runtime struct {
              Prepare func(context.Context, string, string) (Turn, error)
              Run func(context.Context, Turn, string) error
              Stop func(context.Context, Turn) error
              Session func(context.Context, string) (string, error)
              Model func(context.Context) (string, error)
              Workspace func() string
          }
          '''+text[end:]
          text=re.sub(r'active\s+map\[string\]string', 'active map[string]*activeTurn', text)
          text=text.replace('active: make(map[string]string)', 'active: make(map[string]*activeTurn)')
          text=text.replace('m.active = make(map[string]string)', 'm.active = make(map[string]*activeTurn)')
          text=text.replace('m.startLocked()\n\treturn m.Status(), nil', 'return m.Status(), nil')
          p.write_text(text)
          replace_function('internal/zalo/manager.go','func (m *Manager) Unpair(','''func (m *Manager) Unpair(chatID string) (Status, error) {
              chatID = strings.TrimSpace(chatID)
              if chatID == "" { return Status{}, errors.New("missing chat ID") }
              m.mu.Lock()
              kept := make([]string, 0, len(m.state.PairedChatIDs))
              for _, id := range m.state.PairedChatIDs { if id != chatID { kept = append(kept, id) } }
              m.state.PairedChatIDs = kept
              active := m.active[chatID]
              var run Turn
              if active != nil { run = active.Turn }
              stop := m.runtime.Stop
              delete(m.state.ChatSessions, chatID)
              delete(m.active, chatID)
              err := m.saveLocked()
              m.mu.Unlock()
              if active != nil { active.cancel() }
              err = errors.Join(err, cancelRemoteRuns(stop, []Turn{run}))
              m.setError(err)
              return m.Status(), err
          }''')
          replace_function('internal/zalo/manager.go','func (m *Manager) stopLocked()', '''func (m *Manager) stopLocked() {
              m.mu.Lock()
              cancel, done, stop := m.cancel, m.done, m.runtime.Stop
              runs := make([]Turn, 0, len(m.active))
              cancellations := make([]context.CancelFunc, 0, len(m.active))
              for _, active := range m.active {
                  runs = append(runs, active.Turn)
                  cancellations = append(cancellations, active.cancel)
              }
              m.active = make(map[string]*activeTurn)
              m.cancel, m.done, m.running = nil, nil, false
              m.generation++
              m.mu.Unlock()
              if cancel != nil { cancel() }
              for _, stopContext := range cancellations { stopContext() }
              if err := cancelRemoteRuns(stop, runs); err != nil {
                  m.setError(err)
                  m.log.Warn("Zalo remote run cancellation failed", "err", err)
              }
              if done != nil { <-done }
          }''')
          replace_function('internal/zalo/manager.go','func cancelRemoteRuns(', '''func cancelRemoteRuns(stop func(context.Context, Turn) error, runs []Turn) error {
              if stop == nil { return nil }
              ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
              defer cancel()
              seen := make(map[string]bool, len(runs))
              var failures []error
              for _, run := range runs {
                  key := run.WorkspaceID + "\\x00" + run.SessionID
                  if run.SessionID == "" || run.WorkspaceID == "" || seen[key] { continue }
                  seen[key] = true
                  if err := stop(ctx, run); err != nil {
                      failures = append(failures, fmt.Errorf("cancel remote session %s: %w", run.SessionID, err))
                  }
              }
              return errors.Join(failures...)
          }''')
          for name in ['startTurn', 'Done', 'deliverAnswer', 'stopTurn']:
              replace_function('internal/zalo/bridge.go', 'func (m *Manager) '+name+'(', '')
          Path('internal/zalo/turn.go').write_text('''package zalo

          import (
              "context"
              "errors"
              "fmt"
              "os"
              "path/filepath"
              "strings"
              "time"

              "github.com/google/uuid"
          )

          type Turn struct {
              ID string
              WorkspaceID string
              WorkspacePath string
              SessionID string
          }

          type Completion struct {
              RunID string
              SessionID string
              Text string
              Error string
              Cancelled bool
          }

          type activeTurn struct {
              Turn
              ctx context.Context
              cancel context.CancelFunc
              completed bool
          }

          func (m *Manager) startTurn(ctx context.Context, client *Client, update Update) {
              runtime := m.runtimeSnapshot()
              if runtime.Prepare == nil || runtime.Run == nil {
                  m.reply(ctx, client, update.ChatID, "Gotack is not ready to run this request.")
                  return
              }
              turnCtx, cancel := context.WithCancel(ctx)
              active := &activeTurn{Turn: Turn{ID: uuid.NewString()}, ctx: turnCtx, cancel: cancel}
              m.mu.Lock()
              if !contains(m.state.PairedChatIDs, update.ChatID) || m.state.Token != client.token {
                  m.mu.Unlock(); cancel(); return
              }
              if _, busy := m.active[update.ChatID]; busy {
                  m.mu.Unlock(); cancel()
                  m.reply(ctx, client, update.ChatID, "Gotack is still handling the previous request. Use /stop to cancel it.")
                  return
              }
              existing := m.state.ChatSessions[update.ChatID]
              m.active[update.ChatID] = active
              m.mu.Unlock()
              fail := func(err error) {
                  if m.finishTurn(update.ChatID, active.ID) {
                      m.log.Warn("Zalo turn failed", "run", active.ID, "err", err)
                      if ctx.Err() == nil && m.paired(update.ChatID) {
                          m.reply(ctx, client, update.ChatID, "Request failed: "+err.Error())
                      }
                  }
              }
              run, err := runtime.Prepare(turnCtx, existing, update.ChatID)
              if err != nil { fail(err); return }
              run.ID = active.ID
              if run.SessionID == "" || run.WorkspaceID == "" || !filepath.IsAbs(run.WorkspacePath) {
                  fail(errors.New("incomplete workspace/session identity")); return
              }
              m.mu.Lock()
              current := m.active[update.ChatID]
              if current != active || turnCtx.Err() != nil || !contains(m.state.PairedChatIDs, update.ChatID) {
                  m.mu.Unlock(); cancel(); return
              }
              active.Turn = run
              m.state.ChatSessions[update.ChatID] = run.SessionID
              err = m.saveLocked()
              m.mu.Unlock()
              if err != nil { fail(err); return }
              content := strings.TrimSpace(update.Text)
              if update.AttachmentURL != "" {
                  inbox := filepath.Join(run.WorkspacePath, ".tack", "zalo-inbox", run.ID)
                  if err := os.MkdirAll(inbox, 0o700); err != nil { fail(err); return }
                  path, err := client.DownloadAttachment(turnCtx, update.AttachmentURL, inbox)
                  if err != nil { fail(err); return }
                  if content == "" { content = defaultFilePrompt }
                  content += "\\n\\nZalo attachment saved at: " + path
              }
              if content == "" { fail(errors.New("empty request")); return }
              if turnCtx.Err() != nil { fail(turnCtx.Err()); return }
              client.SendChatAction(turnCtx, update.ChatID, "typing")
              if err := runtime.Run(turnCtx, run, content); err != nil {
                  m.mu.Lock()
                  completed := active.completed
                  m.mu.Unlock()
                  if !completed { fail(err) }
              }
          }

          func (m *Manager) finishTurn(chatID, runID string) bool {
              m.mu.Lock()
              active := m.active[chatID]
              if active == nil || active.ID != runID {
                  m.mu.Unlock(); return false
              }
              delete(m.active, chatID)
              m.mu.Unlock()
              active.cancel()
              return true
          }

          func (m *Manager) Done(completion Completion) {
              if completion.RunID == "" || completion.SessionID == "" { return }
              m.mu.Lock()
              var chatID string
              var active *activeTurn
              for chat, candidate := range m.active {
                  if candidate.ID == completion.RunID && candidate.SessionID == completion.SessionID && !candidate.completed {
                      chatID, active = chat, candidate
                      break
                  }
              }
              if active == nil { m.mu.Unlock(); return }
              active.completed = true
              token, run := m.state.Token, active.Turn
              m.mu.Unlock()
              go func() {
                  defer m.finishTurn(chatID, run.ID)
                  if active.ctx.Err() != nil || !m.authorized(chatID, token) { return }
                  client, err := m.newClient(token)
                  if err != nil { m.setError(err); return }
                  text := completion.Text
                  includeFiles := completion.Error == "" && !completion.Cancelled
                  if completion.Error != "" { text = "Request failed: " + completion.Error + "\\n" + text }
                  if completion.Cancelled { text = "Request cancelled.\\n" + text }
                  m.deliverAnswer(active.ctx, client, chatID, text, run.WorkspacePath, includeFiles)
              }()
          }

          func (m *Manager) authorized(chatID, token string) bool {
              m.mu.Lock()
              defer m.mu.Unlock()
              return token != "" && token == m.state.Token && contains(m.state.PairedChatIDs, chatID)
          }

          func (m *Manager) deliverAnswer(ctx context.Context, client *Client, chatID, text, workspace string, includeFiles bool) {
              var paths []string
              if includeFiles { paths = extractMediaPaths(text, workspace, time.Time{}) }
              clean := sanitizeReply(text)
              if clean == "" { clean = "Done." }
              for index, part := range chunkText(clean, maxMessageChars) {
                  if ctx.Err() != nil || !m.authorized(chatID, client.token) { return }
                  if index > 0 {
                      timer := time.NewTimer(200*time.Millisecond)
                      select {
                      case <-ctx.Done(): timer.Stop(); return
                      case <-timer.C:
                      }
                  }
                  if err := client.SendMessage(ctx, chatID, part); err != nil { m.setError(err); return }
              }
              for _, path := range paths {
                  if ctx.Err() != nil || !m.authorized(chatID, client.token) { return }
                  if err := m.sendPath(ctx, client, chatID, path); err != nil {
                      m.reply(ctx, client, chatID, "Could not send "+filepath.Base(path)+": "+err.Error())
                  }
              }
          }

          func (m *Manager) stopTurn(ctx context.Context, client *Client, chatID string) {
              m.mu.Lock()
              active := m.active[chatID]
              var run Turn
              if active != nil { run = active.Turn }
              m.mu.Unlock()
              if active == nil { m.reply(ctx, client, chatID, "No active request."); return }
              active.cancel()
              runtime := m.runtimeSnapshot()
              if run.SessionID != "" {
                  if runtime.Stop == nil { m.reply(ctx, client, chatID, "Cannot cancel the engine request."); return }
                  if err := runtime.Stop(ctx, run); err != nil {
                      m.reply(ctx, client, chatID, fmt.Sprintf("Cancellation failed: %v", err)); return
                  }
              }
              m.finishTurn(chatID, run.ID)
              m.reply(ctx, client, chatID, "Request cancelled.")
          }
          ''')
          p=Path('zalo_host.go'); text=p.read_text()
          text=text.replace('Start:     a.startZaloTurn,','Prepare: a.prepareZaloTurn,\n\t\tRun: a.runZaloTurn,')
          p.write_text(text)
          replace_function('zalo_host.go','func (a *App) startZaloTurn(', '''func (a *App) prepareZaloTurn(ctx context.Context, existingSession, chatID string) (zalo.Turn, error) {
              svc, err := a.services()
              if err != nil { return zalo.Turn{}, err }
              workspace, ok := svc.ws.Current()
              if !ok { return zalo.Turn{}, errors.New("no workspace is open") }
              turn := zalo.Turn{SessionID: existingSession, WorkspaceID: workspace.WorkspaceID, WorkspacePath: workspace.Path}
              if turn.SessionID == "" {
                  created, err := svc.api.CreateSession(ctx, turn.WorkspaceID, "Zalo: "+chatID)
                  if err != nil { return zalo.Turn{}, err }
                  turn.SessionID = created.ID
              } else if _, err := svc.api.GetSession(ctx, turn.WorkspaceID, turn.SessionID); err != nil {
                  return zalo.Turn{}, err
              }
              return turn, nil
          }

          func (a *App) runZaloTurn(ctx context.Context, turn zalo.Turn, text string) error {
              svc, err := a.services()
              if err != nil { return err }
              return svc.api.SendPromptWithPurpose(ctx, turn.WorkspaceID, turn.SessionID, text, turn.ID, "zalo", nil)
          }''')
          replace_function('zalo_host.go','func (a *App) stopZaloTurn(', '''func (a *App) stopZaloTurn(ctx context.Context, turn zalo.Turn) error {
              connection := a.getConn()
              if connection == nil || connection.api == nil { return errors.New("engine connection is unavailable") }
              return connection.api.CancelPrompt(ctx, turn.WorkspaceID, turn.SessionID)
          }''')
          replace('internal/uievents/forwarder.go','type SessionDonePayload struct {','type SessionDonePayload struct {\n\tRunID string `json:"run_id,omitempty"`')
          replace('internal/uievents/forwarder.go','done := SessionDonePayload{SessionID:', 'done := SessionDonePayload{RunID: rc.RunID, SessionID:')
          replace('run_host.go','import "github.com/Dyu-36/gotack/internal/uievents"',
              'import ("github.com/Dyu-36/gotack/internal/uievents"; "github.com/Dyu-36/gotack/internal/zalo")')
          replace('run_host.go','a.zalo.Done(done.SessionID, done.Text)',
              'a.zalo.Done(zalo.Completion{RunID: done.RunID, SessionID: done.SessionID, Text: done.Text, Error: done.Error, Cancelled: done.Cancelled})')
          p=Path('internal/zalo/manager_test.go'); text=p.read_text()
          text=text.replace('payload, _ := json.Marshal(next)', '''wire := make([]map[string]any, 0, len(next))
                      for _, update := range next {
                          message := map[string]any{"message_id": update.MessageID, "chat": map[string]any{"id": update.ChatID}, "text": update.Text}
                          if update.AttachmentURL != "" { message["document"] = map[string]string{"url":update.AttachmentURL} }
                          wire = append(wire, map[string]any{"update_id": update.UpdateID, "message":message})
                      }
                      payload, _ := json.Marshal(wire)''')
          text=text.replace('Start: func(_ context.Context, existing, chatID, text string) (string, error) {\n\t\t\treturn "session-" + chatID + "-" + strings.ReplaceAll(text, " ", "_"), nil\n\t\t},',
              'Prepare: func(_ context.Context, existing, chatID string) (Turn, error) { return Turn{WorkspaceID:"workspace", WorkspacePath:t.TempDir(), SessionID:"session-"+chatID}, nil },\n\t\tRun: func(context.Context, Turn, string) error { return nil },')
          text=text.replace('if !status.Configured || status.Running == false {','if !status.Configured || status.Running {')
          text=text.replace('expected running configured channel','expected configured channel without implicit remote activation')
          text=text.replace('Start:   func(_ context.Context, _, chatID, _ string) (string, error) { return "session-" + chatID, nil },',
              'Prepare: func(_ context.Context, _, chatID string) (Turn, error) { return Turn{WorkspaceID:"workspace", WorkspacePath:t.TempDir(), SessionID:"session-"+chatID}, nil },\n\t\tRun: func(context.Context, Turn, string) error { return nil },')
          text=text.replace('\tmanager.active["c1"] = "session-c1"\n','')
          text=text.replace('manager.Done("session-c1", "all finished")',
              'manager.mu.Lock()\n\trunID := manager.active["c1"].ID\n\tmanager.mu.Unlock()\n\tmanager.Done(Completion{RunID:runID, SessionID:"session-c1", Text:"all finished"})')
          text=text.replace('Start: func(_ context.Context, _, _, text string) (string, error) {\n\t\t\tgotText = text\n\t\t\treturn "session-c1", nil\n\t\t},',
              'Prepare: func(context.Context, string, string) (Turn, error) { return Turn{WorkspaceID:"workspace", WorkspacePath:t.TempDir(), SessionID:"session-c1"}, nil },\n\t\tRun: func(_ context.Context, _ Turn, text string) error { gotText = text; return nil },')
          text=text.replace('manager.state.PairedChatIDs = []string{"c1"}', 'manager.state.PairedChatIDs = []string{"c1"}\n\tmanager.state.Token = "token-1"')
          text=text.replace('\tdownloadedPath := filepath.Join(os.TempDir(), "gotack-zalo-inbox", fileName)\n\tt.Cleanup(func() { _ = os.Remove(downloadedPath) })\n','')
          text=text.replace('if !strings.Contains(gotText, downloadedPath) {\n\t\tt.Fatalf("attachment-only prompt = %q, want downloaded path %q", gotText, downloadedPath)\n\t}',
              'if !strings.Contains(gotText, fileName) || !strings.Contains(gotText, "zalo-inbox") { t.Fatalf("missing isolated attachment path: %s", gotText) }')
          p.write_text(text)
          p=Path('internal/zalo/revocation_test.go'); text=p.read_text()
          text=text.replace('func(_ context.Context, id string) error', 'func(_ context.Context, run Turn) error')
          text=text.replace('append(cancelled, id)', 'append(cancelled, run.SessionID)')
          text=text.replace('map[string]string{"a": "one", "b": "two"}', 'map[string]string{"a": "one", "b": "two"}')
          text=text.replace('m.active = map[string]string{"a": "one", "b": "two"}',
              'm.active = map[string]*activeTurn{"a": testActiveTurn("one"), "b": testActiveTurn("two")}')
          text=text.replace('m.active["b"] != "two"', 'm.active["b"].SessionID != "two"')
          text=text.replace('m.active = map[string]string{"a": "one", "b": "one", "c": "starting"}',
              'm.active = map[string]*activeTurn{"a": testActiveTurn("one"), "b": testActiveTurn("one"), "c": testActiveTurn("")}')
          text+='''
          func testActiveTurn(sessionID string) *activeTurn {
              ctx, cancel := context.WithCancel(context.Background())
              return &activeTurn{Turn:Turn{ID:"run-"+sessionID, WorkspaceID:"workspace", SessionID:sessionID},ctx:ctx,cancel:cancel}
          }
          '''
          p.write_text(text)
          Path('internal/zalo/turn_test.go').write_text('''package zalo

          import (
              "context"
              "errors"
              "strings"
              "testing"
              "time"
          )

          func TestCompletionBeforeSendReturnsIsDeliveredExactlyOnce(t *testing.T) {
              manager, server := newManagerForTest(t, "token")
              defer manager.Stop()
              root := t.TempDir()
              var accepted Turn
              manager.SetRuntime(Runtime{
                  Prepare: func(context.Context, string, string) (Turn,error) {
                      return Turn{WorkspaceID:"workspace", WorkspacePath:root, SessionID:"session"},nil
                  },
                  Run: func(_ context.Context, run Turn, _ string) error {
                      accepted=run
                      manager.Done(Completion{RunID:run.ID,SessionID:run.SessionID,Text:"early completion"})
                      manager.Done(Completion{RunID:run.ID,SessionID:run.SessionID,Text:"duplicate completion"})
                      return errors.New("response arrived after completion")
                  },
              })
              manager.mu.Lock(); manager.state.PairedChatIDs=[]string{"chat"}; manager.mu.Unlock()
              manager.dispatch(context.Background(),mustClient(t,manager,"token"),Update{ChatID:"chat",Text:"run"})
              if accepted.ID=="" { t.Fatal("missing run identity") }
              if !waitFor(t,time.Second,func()bool{
                  for _, text:=range server.deliveredMessages(t){if text=="early completion" {return true}}
                  return false
              }) {t.Fatal("completion was lost")}
              for _, text:=range server.deliveredMessages(t){
                  if strings.Contains(text,"duplicate completion") || strings.Contains(text,"response arrived") {t.Fatalf("duplicate/error reply: %s",text)}
              }
          }

          func TestOldCompletionCannotFinishNewTurnInSameSession(t *testing.T) {
              manager, server:=newManagerForTest(t,"token")
              defer manager.Stop()
              manager.mu.Lock()
              manager.state.PairedChatIDs=[]string{"chat"}
              active:=testActiveTurn("session")
              active.ID="new-run"
              manager.active["chat"]=active
              manager.mu.Unlock()
              manager.Done(Completion{RunID:"old-run",SessionID:"session",Text:"wrong result"})
              manager.mu.Lock(); unchanged:=manager.active["chat"]==active && !active.completed; manager.mu.Unlock()
              if !unchanged || len(server.deliveredMessages(t))!=0 {t.Fatal("stale event completed another run")}
              manager.Done(Completion{RunID:"new-run",SessionID:"session",Error:"provider unavailable"})
              if !waitFor(t,time.Second,func()bool{
                  for _, text:=range server.deliveredMessages(t){if strings.Contains(text,"provider unavailable"){return true}}
                  return false
              }) {t.Fatal("failure was not reported")}
              for _, text:=range server.deliveredMessages(t){if text=="Done." {t.Fatal("failure reported as success")}}
          }

          func TestChangingTokenDoesNotRetainRemotePairings(t *testing.T) {
              manager,_:=newManagerForTest(t,"first")
              defer manager.Stop()
              manager.mu.Lock();manager.state.PairedChatIDs=[]string{"old-chat"};manager.mu.Unlock()
              if _,err:=manager.SetToken(context.Background(),"second");err!=nil{t.Fatal(err)}
              if manager.paired("old-chat") || manager.Status().Running {t.Fatal("new bot inherited access or started implicitly")}
          }
          ''')
          Path('.github/workflows/apply-zalo-turns.yml').unlink()
          changed=subprocess.check_output(['git','ls-files','-m','-o','--exclude-standard']).decode().splitlines()
          files=[p for p in changed if p.endswith('.go') and Path(p).is_file()]
          subprocess.run(['gofmt','-w',*files],check=True)
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add app_quit.go tray_windows.go internal/zalo internal/uievents/forwarder.go zalo_host.go run_host.go .github/workflows/apply-zalo-turns.yml
          git commit -m 'fix: correlate Zalo completions and cancel runs in their original workspace'
          git fetch origin production/pi-desktop-completion
          git rebase origin/production/pi-desktop-completion
          git push origin HEAD:production/pi-desktop-completion
      - name: Test and analyze implementation
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 ./internal/zalo ./internal/uievents
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
