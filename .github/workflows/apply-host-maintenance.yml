name: Apply desktop maintenance

on:
  push:
    branches: [production/pi-desktop-completion]
    paths: [.github/workflows/apply-host-maintenance.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/gotack'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-completion
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply reviewed changes
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          def replace(path, before, after, count=1):
              p=Path(path); s=p.read_text()
              assert s.count(before)==count,(path,s.count(before),before[:100])
              p.write_text(s.replace(before,after))
          def function(path, signature, replacement):
              p=Path(path); s=p.read_text(); start=s.index(signature)
              end=s.find('\nfunc ',start+len(signature))
              if end < 0: end=len(s)
              p.write_text(s[:start]+replacement.rstrip()+'\n'+s[end:])
          Path('engine_pin.go').write_text('''package main

          import (
              _ "embed"
              "strings"
          )

          //go:embed .tack-pin
          var packagedEngineCommit string

          func expectedEngineCommit(customBinary string) string {
              if customBinary != "" { return "" }
              return strings.TrimSpace(packagedEngineCommit)
          }
          ''')
          replace('app.go','a.link = engine.NewLink(sup)','a.link = engine.NewLink(sup, expectedEngineCommit(cfg.EngineBinary))')
          replace('internal/engine/link.go','"sync"','"sync"\n\t"strings"')
          replace('internal/engine/link.go','type Link struct {','type Link struct {\n\texpectedCommit string')
          replace('internal/engine/link.go','func NewLink(sup supervisor) *Link {\n',
              'func NewLink(sup supervisor, expected ...string) *Link {\n\tcommit := ""\n\tif len(expected) > 0 { commit = strings.TrimSpace(expected[0]) }\n')
          replace('internal/engine/link.go','\t\tsup:              sup,','\t\texpectedCommit: commit,\n\t\tsup:              sup,')
          replace('internal/engine/link.go','\treturn ready(scope, api, ep, vi.Version)',
              '\tif l.expectedCommit != "" && vi.Commit != l.expectedCommit {\n\t\treturn fmt.Errorf("engine commit mismatch: expected %s, got %s; reinstall the bundled engine", l.expectedCommit, vi.Commit)\n\t}\n\treturn ready(scope, api, ep, vi.Version)')
          Path('internal/engine/runtime.go').write_text('''package engine

          import (
              "os"
              "path/filepath"
              "strings"
          )

          func bundledPythonEnvironment(env []string, executable string) []string {
              python := filepath.Join(filepath.Dir(executable), "resources", "python", "python.exe")
              info, err := os.Stat(python)
              if err != nil || !info.Mode().IsRegular() { return env }
              result := make([]string, 0, len(env)+1)
              for _, entry := range env {
                  name, _, _ := strings.Cut(entry, "=")
                  if !strings.EqualFold(name, "GOTACK_PYTHON") { result = append(result, entry) }
              }
              return append(result, "GOTACK_PYTHON="+python)
          }
          ''')
          replace('internal/engine/supervisor.go','\tcmd.Env = isolatedEngineEnvironment(engineDir)',
              '\tcmd.Env = isolatedEngineEnvironment(engineDir)\n\tif executable, err := os.Executable(); err == nil {\n\t\tcmd.Env = bundledPythonEnvironment(cmd.Env, executable)\n\t}')
          for name in ['internal/appconfig/doc.go','internal/session/doc.go','internal/uievents/doc.go','internal/workspace/doc.go']:
              p=Path(name)
              assert re.fullmatch(r'package\s+\w+\s*',p.read_text())
              p.unlink()
          Path('internal/engine/runtime_test.go').write_text('''package engine

          import (
              "os"
              "path/filepath"
              "strings"
              "testing"
          )

          func TestBundledPythonEnvironment(t *testing.T) {
              root := t.TempDir()
              executable := filepath.Join(root, "gotack.exe")
              original := []string{"PATH=project-python", "GOTACK_PYTHON=old"}
              absent := bundledPythonEnvironment(original, executable)
              if strings.Join(absent, "|") != strings.Join(original, "|") { t.Fatal("development environment changed") }
              python := filepath.Join(root, "resources", "python", "python.exe")
              if err := os.MkdirAll(filepath.Dir(python), 0o700); err != nil { t.Fatal(err) }
              if err := os.WriteFile(python, nil, 0o600); err != nil { t.Fatal(err) }
              got := bundledPythonEnvironment(original, executable)
              if len(got) != 2 || got[0] != "PATH=project-python" || got[1] != "GOTACK_PYTHON="+python { t.Fatalf("unexpected environment: %v", got) }
              if original[1] != "GOTACK_PYTHON=old" { t.Fatal("input environment mutated") }
          }
          ''')
          p=Path('internal/zalo/manager.go'); s=p.read_text()
          s=s.replace('\t"crypto/rand"\n','').replace('\t"encoding/binary"\n','')
          s=s.replace('\t"sync"\n','\t"sync"\n\t"time"\n')
          s=s.replace('type StoredChannel struct {','type StoredChannel struct {\n\tPairingExpiresAt int64 `json:"pairing_expires_at,omitempty"`')
          s=s.replace('type Manager struct {','type Manager struct {\n\tpairAttempts map[string]pairAttempt\n\tpairWindow time.Time\n\tpairCount int')
          s=s.replace('if m.state.Token != "" && m.state.PairingCode == "" {',
              'if m.state.Token != "" && (m.state.PairingCode == "" || m.state.PairingExpiresAt <= time.Now().Unix()) {')
          s=s.replace('m.state.PairingCode = pairingCode()','m.rotatePairingLocked(time.Now())')
          start=s.index('func pairingCode() string {'); end=s.index('\nfunc ',start+1)
          s=s[:start]+s[end:]
          p.write_text(s)
          function('internal/zalo/manager.go','func (m *Manager) saveLocked() error {','''func (m *Manager) saveLocked() error {
              if err := os.MkdirAll(filepath.Dir(m.path), 0o700); err != nil { return err }
              data, err := json.MarshalIndent(m.state, "", "  ")
              if err != nil { return err }
              file, err := os.CreateTemp(filepath.Dir(m.path), ".zalo-*")
              if err != nil { return err }
              name := file.Name()
              defer os.Remove(name)
              if _, err = file.Write(data); err == nil { err = file.Sync() }
              closeErr := file.Close()
              if err != nil { return err }
              if closeErr != nil { return closeErr }
              return os.Rename(name, m.path)
          }''')
          Path('internal/zalo/pairing.go').write_text('''package zalo

          import (
              "crypto/rand"
              "crypto/subtle"
              "errors"
              "fmt"
              "math/big"
              "strings"
              "time"
          )

          const pairingLifetime = 10 * time.Minute
          const pairingAttemptWindow = time.Minute

          type pairAttempt struct { Since time.Time; Count int }

          func pairingCode() string {
              value, err := rand.Int(rand.Reader, big.NewInt(1_000_000))
              if err != nil { return "" }
              return fmt.Sprintf("%06d", value.Int64())
          }

          func (m *Manager) rotatePairingLocked(now time.Time) {
              m.state.PairingCode = pairingCode()
              m.state.PairingExpiresAt = 0
              if m.state.PairingCode != "" {
                  m.state.PairingExpiresAt = now.Add(pairingLifetime).Unix()
              } else {
                  m.lastError = "Cannot obtain secure randomness for Zalo pairing"
              }
          }

          func (m *Manager) acceptPairing(chatID, code string, now time.Time) error {
              if strings.TrimSpace(chatID) == "" || len(chatID) > 256 { return errors.New("invalid chat identifier") }
              m.mu.Lock()
              defer m.mu.Unlock()
              if contains(m.state.PairedChatIDs, chatID) { return nil }
              if m.pairAttempts == nil { m.pairAttempts = make(map[string]pairAttempt) }
              if now.Sub(m.pairWindow) >= pairingAttemptWindow {
                  m.pairWindow, m.pairCount = now, 0
                  for id, attempt := range m.pairAttempts {
                      if now.Sub(attempt.Since) >= pairingAttemptWindow { delete(m.pairAttempts, id) }
                  }
              }
              attempt := m.pairAttempts[chatID]
              if now.Sub(attempt.Since) >= pairingAttemptWindow { attempt = pairAttempt{Since: now} }
              if m.pairCount >= 30 || attempt.Count >= 5 || len(m.pairAttempts) >= 1024 {
                  return errors.New("too many pairing attempts; retry after one minute")
              }
              attempt.Count++
              m.pairAttempts[chatID] = attempt
              m.pairCount++
              if m.state.PairingCode == "" || now.Unix() >= m.state.PairingExpiresAt {
                  return errors.New("pairing code expired; generate a new code in desktop settings")
              }
              if len(code) != 6 || subtle.ConstantTimeCompare([]byte(code), []byte(m.state.PairingCode)) != 1 {
                  return errors.New("incorrect pairing code")
              }
              previous := m.state
              m.state.PairedChatIDs = append(append([]string(nil), previous.PairedChatIDs...), chatID)
              m.rotatePairingLocked(now)
              if err := m.saveLocked(); err != nil {
                  m.state = previous
                  return fmt.Errorf("persist pairing: %w", err)
              }
              delete(m.pairAttempts, chatID)
              return nil
          }

          func (m *Manager) paired(chatID string) bool {
              m.mu.Lock()
              defer m.mu.Unlock()
              return contains(m.state.PairedChatIDs, chatID)
          }
          ''')
          function('internal/zalo/bridge.go','func (m *Manager) handlePair(','''func (m *Manager) handlePair(ctx context.Context, client *Client, chatID, text string) {
              fields := strings.Fields(text)
              code := ""
              if len(fields) == 2 { code = fields[1] }
              if err := m.acceptPairing(chatID, code, time.Now()); err != nil {
                  m.reply(ctx, client, chatID, err.Error())
                  return
              }
              m.log.Info("zalo chat paired", "chat", chatID)
              m.reply(ctx, client, chatID, helpText)
          }''')
          replace('internal/zalo/bridge.go','m.handlePair(ctx, client, update.ChatID, text, paired, state.PairingCode)',
              'm.handlePair(ctx, client, update.ChatID, text)')
          replace('internal/zalo/bridge.go','\t"strings"\n','\t"strings"\n\t"sync"\n')
          replace('internal/zalo/bridge.go','\tbackoff := minBackoff',
              '\tvar dispatches sync.WaitGroup\n\tdefer dispatches.Wait()\n\tslots := make(chan struct{}, 8)\n\tbackoff := minBackoff')
          replace('internal/zalo/bridge.go','\t\t\tgo m.dispatch(context.Background(), client, update)',
              '\t\t\tselect {\n\t\t\tcase slots <- struct{}{}:\n\t\t\tcase <-ctx.Done(): return\n\t\t\t}\n\t\t\tdispatches.Add(1)\n\t\t\tgo func(c *Client, u Update) {\n\t\t\t\tdefer dispatches.Done()\n\t\t\t\tdefer func() { <-slots }()\n\t\t\t\tm.dispatch(ctx, c, u)\n\t\t\t}(client, update)')
          replace('internal/zalo/bridge.go','\tm.active[update.ChatID] = sessionID\n',
              '\tif ctx.Err() != nil || !contains(m.state.PairedChatIDs, update.ChatID) {\n\t\tdelete(m.active, update.ChatID)\n\t\tm.mu.Unlock()\n\t\tif m.runtime.Stop != nil {\n\t\t\tstopCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\t\t\tdefer cancel()\n\t\t\t_ = m.runtime.Stop(stopCtx, sessionID)\n\t\t}\n\t\treturn\n\t}\n\tm.active[update.ChatID] = sessionID\n')
          replace('internal/zalo/bridge.go','func (m *Manager) deliverAnswer(ctx context.Context, client *Client, chatID, text string) {\n',
              'func (m *Manager) deliverAnswer(ctx context.Context, client *Client, chatID, text string) {\n\tif !m.paired(chatID) { return }\n')
          replace('internal/zalo/bridge.go','\tfor _, part := range chunkText(clean, maxMessageChars) {\n',
              '\tfor _, part := range chunkText(clean, maxMessageChars) {\n\t\tif !m.paired(chatID) { return }\n')
          replace('internal/zalo/bridge.go','func (m *Manager) sendPath(ctx context.Context, client *Client, chatID, path string) error {\n',
              'func (m *Manager) sendPath(ctx context.Context, client *Client, chatID, path string) error {\n\tif !m.paired(chatID) { return fmt.Errorf("Zalo chat is no longer paired") }\n')
          Path('internal/zalo/pairing_test.go').write_text('''package zalo

          import (
              "path/filepath"
              "testing"
              "time"
          )

          func TestPairingIsExpiringSingleUseAndDurable(t *testing.T) {
              m := NewManager(filepath.Join(t.TempDir(), "zalo.json"), Runtime{}, nil)
              now := time.Now()
              m.state.Token = "test-token"
              m.rotatePairingLocked(now)
              code := m.state.PairingCode
              if len(code) != 6 { t.Fatal("missing random code") }
              if err := m.acceptPairing("first", code, now); err != nil { t.Fatal(err) }
              if !m.paired("first") { t.Fatal("pairing was not applied") }
              saved := NewManager(m.path, Runtime{}, nil)
              if !saved.paired("first") { t.Fatal("pairing was not persisted") }
              if err := m.acceptPairing("second", code, now); err == nil { t.Fatal("consumed code was reusable") }
              expired := m.state.PairingCode
              if err := m.acceptPairing("third", expired, now.Add(pairingLifetime)); err == nil { t.Fatal("expired code accepted") }
          }

          func TestPairingAttemptsAreBounded(t *testing.T) {
              m := NewManager(filepath.Join(t.TempDir(), "zalo.json"), Runtime{}, nil)
              now := time.Now()
              m.rotatePairingLocked(now)
              for range 5 {
                  if err := m.acceptPairing("chat", "invalid", now); err == nil { t.Fatal("incorrect code accepted") }
              }
              if err := m.acceptPairing("chat", m.state.PairingCode, now); err == nil { t.Fatal("attempt limit bypassed") }
              if err := m.acceptPairing("chat", m.state.PairingCode, now.Add(pairingAttemptWindow)); err != nil { t.Fatal(err) }
          }

          func TestPairingPersistenceFailureDoesNotGrantAccess(t *testing.T) {
              m := NewManager(t.TempDir(), Runtime{}, nil)
              now := time.Now()
              m.rotatePairingLocked(now)
              code := m.state.PairingCode
              if err := m.acceptPairing("chat", code, now); err == nil { t.Fatal("persisting over directory should fail") }
              if m.paired("chat") || m.state.PairingCode != code { t.Fatal("failed transaction changed access state") }
          }
          ''')
          p=Path('frontend/src/components/SettingsModal.svelte'); s=p.read_text()
          s=s.replace('onSaveSettings?: (settings: SettingsPayload) => void','onSaveSettings?: (settings: SettingsPayload) => Promise<void>')
          s=s.replace('onSaveSettings = () => {},','onSaveSettings = async () => {},')
          s=s.replace("let hydrated = false","let hydrated = false\n  let savingSettings = $state(false)")
          s=s.replace('  function save() {','  async function save() {\n    if (savingSettings) return\n    savingSettings = true')
          before="    onThemeChange(selectedTheme)\n    onSaveSettings(payload)\n    currentApiKey = ''\n    onClose()"
          after="    try {\n      await onSaveSettings(payload)\n      onThemeChange(selectedTheme)\n      currentApiKey = ''\n      onClose()\n    } catch (cause) {\n      toast.error(cause instanceof Error ? cause.message : String(cause))\n    } finally {\n      savingSettings = false\n    }"
          assert before in s; s=s.replace(before,after)
          s=s.replace('onclick={save}', 'onclick={save} disabled={savingSettings}')
          p.write_text(s)
          replace('frontend/src/App.svelte',
              'onSaveSettings={(settings) => {\n        void conversations.saveSettings(settings)',
              'onSaveSettings={async (settings) => {\n        const saved = await conversations.saveSettings(settings)\n        if (!saved) throw new Error(conversations.error || "Could not save settings")')
          Path('.github/workflows/apply-host-maintenance.yml').unlink()
          changed=subprocess.check_output(['git','ls-files','-m','-o','--exclude-standard']).decode().splitlines()
          go_files=[p for p in changed if p.endswith('.go') and Path(p).exists()]
          if go_files: subprocess.run(['gofmt','-w',*go_files],check=True)
      - name: Remove retired terminal dependencies
        run: pnpm --dir frontend remove @xterm/xterm @xterm/addon-fit
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add engine_pin.go app.go internal/engine internal/zalo internal/appconfig/doc.go internal/session/doc.go internal/uievents/doc.go internal/workspace/doc.go frontend/src/App.svelte frontend/src/components/SettingsModal.svelte frontend/package.json pnpm-lock.yaml .github/workflows/apply-host-maintenance.yml
          git commit -m 'feat: verified engine identity, expiring Zalo pairing and bundled runtime wiring'
          git fetch origin production/pi-desktop-completion
          git rebase origin/production/pi-desktop-completion
          git push origin HEAD:production/pi-desktop-completion
      - name: Test desktop runtime
        run: go test -count=1 ./...
      - name: Vet desktop runtime
        run: go vet ./...
