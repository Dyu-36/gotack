name: Lock timetable runtime

on:
  pull_request:
    paths: [.github/workflows/lock-timetable-runtime.yml]

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'production/pi-desktop-completion'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-completion
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Resolve exact binary distributions
        shell: python
        run: |
          import email, hashlib, pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as work:
              subprocess.run([sys.executable, '-m', 'pip', 'download', '--only-binary=:all:', '--dest', work, 'ortools==9.15.6755', 'openpyxl==3.1.5', 'defusedxml==0.7.1'], check=True)
              entries=[]
              for wheel in sorted(pathlib.Path(work).glob('*.whl')):
                  with zipfile.ZipFile(wheel) as archive:
                      names=[name for name in archive.namelist() if name.endswith('.dist-info/METADATA')]
                      assert len(names)==1, wheel.name
                      metadata=email.message_from_bytes(archive.read(names[0]))
                  digest=hashlib.sha256(wheel.read_bytes()).hexdigest()
                  entries.append(f"{metadata['Name']}=={metadata['Version']} --hash=sha256:{digest}")
              assert entries
              pathlib.Path('scripts/timetable-requirements.lock').write_text('# Windows x64 / CPython 3.13; all transitive wheels are pinned.\n'+'\n'.join(sorted(entries, key=str.lower))+'\n', encoding='utf-8')
      - name: Build and execute packaged runtime
        run: python scripts/build-timetable-runtime.py
      - name: Commit verified dependency lock and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git rm .github/workflows/lock-timetable-runtime.yml
          if [ -f .github/workflows/development-cache.yml ]; then git rm .github/workflows/development-cache.yml; fi
          git add scripts/timetable-requirements.lock
          git commit -m 'build: lock verified offline timetable dependencies; remove transfer tooling'
          git fetch origin production/pi-desktop-completion
          git rebase origin/production/pi-desktop-completion
          git push origin HEAD:production/pi-desktop-completion
      - uses: actions/upload-artifact@v4
        with:
          name: timetable-runtime
          path: build/bin/resources/python/
          if-no-files-found: error
          retention-days: 7
