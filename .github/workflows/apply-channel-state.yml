name: Apply channel state

on:
  push:
    branches: [production/pi-desktop-completion]
    paths: [.github/workflows/apply-channel-state.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/gotack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-completion
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply channel state changes
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          def replace(path, before, after, count=1):
              p=Path(path); text=p.read_text()
              assert text.count(before)==count,(path,text.count(before),before[:100])
              p.write_text(text.replace(before,after))
          replace('app.go','if a.zalo.Status().Configured {\n\t\ta.zalo.Start()\n\t}', 'a.startZaloIfEnabled()')
          replace('bind_engine.go','if a.zalo != nil && a.zalo.Status().Configured {\n\t\t\ta.zalo.Start()\n\t\t}', 'a.startZaloIfEnabled()')
          p=Path('bind_engine.go');text=p.read_text();start=text.index('func (a *App) stopTransport()');end=text.index('\ntype bridgeServices',start)
          segment=text[start:end]
          before='\tif a.zalo != nil {\n\t\ta.zalo.Stop()\n\t}\n'
          assert segment.count(before)==1
          segment=segment.replace(before,'')
          segment=segment.replace('func (a *App) stopTransport() {\n','func (a *App) stopTransport() {\n'+before)
          p.write_text(text[:start]+segment+text[end:])
          Path('zalo_enable.go').write_text('''package main

          func (a *App) startZaloIfEnabled() {
              if a.zalo == nil { return }
              if a.cfg != nil && a.cfg.Zalo.Enabled && a.zalo.Status().Configured {
                  a.zalo.Start()
              } else {
                  a.zalo.Stop()
              }
          }
          ''')
          replace('bind_zalo.go','type ZaloConfigInfo struct {','type ZaloConfigInfo struct {\n\tPairingExpiresAt int64 `json:"pairing_expires_at,omitempty"`')
          replace('bind_zalo.go','\treturn ZaloConfigInfo{\n','\treturn ZaloConfigInfo{\n\t\tPairingExpiresAt: status.PairingExpiresAt,\n')
          replace('bind_zalo.go','\ta.cfg.Zalo.Enabled = update.Enabled\n\tif err := appconfig.Save(a.cfg); err != nil {\n\t\treturn zalo.Status{}, err\n\t}',
              '\tnext := *a.cfg\n\tnext.Zalo.Enabled = update.Enabled\n\tif err := appconfig.Save(&next); err != nil {\n\t\ta.zalo.Stop()\n\t\treturn zalo.Status{}, err\n\t}\n\ta.cfg = &next')
          replace('bind_zalo.go','\tif update.Enabled {\n\t\ta.zalo.Start()\n\t} else {\n\t\ta.zalo.Stop()\n\t}', '\ta.startZaloIfEnabled()')
          p=Path('frontend/src/platform/desktop.ts');text=p.read_text()
          text=text.replace('export type ZaloConfigInfo = {','export type ZaloConfigInfo = {\n  pairing_expires_at?: number')
          text=text.replace('export type ZaloStatusInfo = {','export type ZaloStatusInfo = {\n  pairing_expires_at?: number')
          p.write_text(text)
          p=Path('frontend/src/components/SettingsModal.svelte');text=p.read_text()
          text=text.replace("let zaloPairingCode = $state('')", "let zaloPairingCode = $state('')\n  let zaloPairingExpires = $state(0)")
          text=text.replace('zaloPairingCode = config.pairing_code', 'zaloPairingCode = config.pairing_code\n      zaloPairingExpires = config.pairing_expires_at ?? 0')
          text=text.replace("zaloPairingCode = zaloStatus.pairing_code ?? ''", "zaloPairingCode = zaloStatus.pairing_code ?? ''\n      zaloPairingExpires = zaloStatus.pairing_expires_at ?? 0")
          anchor='<div class="flex flex-wrap justify-end gap-2 pt-2">'
          pos=text.index(anchor)
          text=text[:pos]+'''{#if zaloPairingCode && zaloPairingExpires}
            <p class="hint">Mã ghép cặp hết hạn lúc {new Date(zaloPairingExpires * 1000).toLocaleString('vi-VN')}. Tạo mã mới nếu mã đã hết hạn.</p>
          {/if}
          '''+text[pos:]
          text=text.replace('Đóng cửa sổ chỉ ẩn Tack xuống khay — Zalo bot và tiến trình vẫn chạy ngầm. Muốn tắt hẳn, End Task tiến trình Tack trong Task Manager.',
              'Trên Windows, đóng cửa sổ chỉ ẩn Gotack xuống khay; Zalo tiếp tục hoạt động khi được bật. Chọn Quit Gotack trong khay hệ thống để thoát và dừng engine.')
          text=text.replace('Tack chạy ẩn trong khay hệ thống', 'Gotack chạy ẩn trong khay hệ thống')
          p.write_text(text)
          Path('zalo_enable_test.go').write_text('''package main

          import (
              "context"
              "net/http"
              "net/http/httptest"
              "path/filepath"
              "testing"

              "github.com/Dyu-36/gotack/internal/appconfig"
              "github.com/Dyu-36/gotack/internal/zalo"
          )

          func TestZaloStartRespectsPersistedEnabledFlag(t *testing.T) {
              server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                  w.Header().Set("Content-Type", "application/json")
                  _, _ = w.Write([]byte(`{"ok":true,"result":[]}`))
              }))
              defer server.Close()
              t.Setenv("ZALO_BOT_API_BASE", server.URL)
              app := NewApp()
              app.cfg = appconfig.Defaults()
              app.zalo = zalo.NewManager(filepath.Join(t.TempDir(), "zalo.json"), zalo.Runtime{}, nil)
              defer app.zalo.Stop()
              if err := app.zalo.ImportLegacy("test-token", nil); err != nil { t.Fatal(err) }
              app.startZaloIfEnabled()
              if app.zalo.Status().Running { t.Fatal("disabled channel auto-started") }
              app.cfg.Zalo.Enabled = true
              app.startZaloIfEnabled()
              if !app.zalo.Status().Running { t.Fatal("enabled channel did not start") }
              app.cfg.Zalo.Enabled = false
              app.startZaloIfEnabled()
              if app.zalo.Status().Running { t.Fatal("disabled channel remained running") }
              if _, err := app.zalo.TestConnection(context.Background()); err != nil { t.Fatal(err) }
              if app.zalo.Status().Running { t.Fatal("connection test enabled the disabled channel") }
          }
          ''')
          Path('.github/workflows/apply-channel-state.yml').unlink()
          changed=subprocess.check_output(['git','ls-files','-m','-o','--exclude-standard']).decode().splitlines()
          files=[p for p in changed if p.endswith('.go') and Path(p).is_file()]
          subprocess.run(['gofmt','-w',*files],check=True)
      - name: Commit runtime and UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add app.go bind_engine.go bind_zalo.go zalo_enable.go zalo_enable_test.go frontend/src/platform/desktop.ts frontend/src/components/SettingsModal.svelte .github/workflows/apply-channel-state.yml
          git commit -m 'fix: honor disabled Zalo channels and preserve connection during cancellation'
          git fetch origin production/pi-desktop-completion
          git rebase origin/production/pi-desktop-completion
          git push origin HEAD:production/pi-desktop-completion
      - name: Verify channel implementation
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 ./internal/zalo ./internal/uievents
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...
