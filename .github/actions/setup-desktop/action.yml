name: Set up desktop build tools
description: Install the pinned Go, frontend, Wails and optional timetable toolchain.
inputs:
  go-cache-dependency-path:
    description: Go module checksums to include in the cache key.
    default: go.sum
  python:
    description: Install Python for the complete timetable distribution.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: ${{ inputs.go-cache-dependency-path }}
    - uses: pnpm/action-setup@v4
      with:
        version: 11.20.0
        run_install: false
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - uses: actions/setup-python@v6
      if: inputs.python == 'true'
      with:
        python-version: '3.13.15'
        architecture: x64
        cache: pip
        cache-dependency-path: scripts/timetable-requirements.lock
    - name: Install pinned Wails
      shell: pwsh
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        if ($LASTEXITCODE -ne 0) { throw 'Cannot install Wails' }
