# https://taskfile.dev
version: "3"

tasks:
  build:
    desc: Build the Gotack agent engine
    cmds:
      - go build -mod=readonly -trimpath -o tack-engine{{exeExt}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - internal/**/*.md
      - internal/**/*.md.tpl
      - internal/**/*.json
      - internal/oauth/callback/*
    generates:
      - tack-engine{{exeExt}}

  run:
    desc: Start the local engine server
    cmds:
      - task: build
      - ./tack-engine{{exeExt}} server {{.CLI_ARGS}}

  test:
    desc: Run the tagged engine tests with the race detector
    cmds:
      - go test -race -tags gotacktest -mod=readonly ./... {{.CLI_ARGS}}

  vet:
    desc: Run analysis used by the Gotack product build
    cmds:
      - go vet -tags gotacktest -copylocks=false -mod=readonly ./...

  lint:log:
    desc: Check capitalization of log messages
    cmds:
      - sh ./scripts/check_log_capitalization.sh

  lint:
    desc: Run golangci-lint
    cmds:
      - task: lint:log
      - golangci-lint run --path-mode=abs --config=.golangci.yml --timeout=5m

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./...

  fmt:html:
    desc: Format the OAuth callback page
    cmds:
      - prettier --write internal/oauth/callback/page.html internal/oauth/callback/page.css internal/oauth/callback/page.js

  swag:
    desc: Generate OpenAPI documentation
    cmds:
      - go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo main.go --dir . --output internal/swagger --packageName swagger --parseDependency --parseInternal --parseDepth 5

  sqlc:
    desc: Generate database bindings
    cmds:
      - sqlc generate

  release:check:
    desc: Validate engine release configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build local engine release archives
    cmds:
      - goreleaser release --snapshot --clean
